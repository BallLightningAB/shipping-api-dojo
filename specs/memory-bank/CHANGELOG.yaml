entries:
  - date: "2026-11-27"
    version: "1.4.1.17"
    commit: pending
    status: uncommitted
    title: "fix(security): patch serialization and test/tooling dependency advisories"
    details: |-
      Reviewed the current GitHub PR queue through two connected API paths:
      no open PRs; main remains the October #42 merge, 1b8fe82.
      A fresh dependency audit nevertheless reported six moderate advisories.
      Updates Vitest to 4.1.12 and the Seroval override to 1.6.11; scopes
      Glob 14.0.6 overrides to Ultracite and Sentry bundler tooling so their
      Minimatch dependency also resolves to a patched release. Audit is zero.
      Keeps the artifact parked and production auth/provider claims deferred.

      Rotated the 618-line changelog using scripts/rotate-changelog.sh and
      corrected the previous entry's actual squash-merge hash. Updated the
      active context and recorded validation plus limitations in
      specs/current-changes/security-pr-review-2026-11-27.md.
      Local validation is complete for commit and PR review. Final validation
      outcomes and retained limitations are recorded in the report.
      Validation: 161 unit/auth and 19 serial browser tests passed, along with
      production build, format/lint/typecheck, schema check, private-key hook,
      Ultracite, Gitleaks, and structured memory-bank/archive YAML checks.
      Refreshed GitHub CLI auth with user assistance and verified the live
      dashboards: four medium Dependabot alerts covered by the prepared fixes,
      zero CodeQL alerts, zero secret-scanning alerts, and zero open PRs.
      Only after auth verification, reran the full browser suite three times
      with four workers and retries disabled: 57 passed, zero failed/skipped.
      Earlier navigation aborts did not recur; their cause remains unproven.
      No translated locales exist to test, and hosted auth remains unverified.
    refs:
      - "I5D14"
      - "#42"

  - date: "2026-10-12"
    version: "1.4.1.16"
    commit: 1b8fe82
    status: committed
    title: "docs: park the artifact and record future launch verification"
    details: |-
      Records the user's clarification that authenticated functionality was
      never established in production. Marks the project as parked, clarifies
      README feature claims, and adds a concise resumption checklist covering
      environments/schema, auth, progress, access tiers, billing/email,
      observability, localization, and dependency/security revalidation.
      Keeps the October security test baseline separate from live acceptance.
      Repairs 15 pre-existing inline progress entries so memory-bank YAML
      parses successfully. The owner requested retaining the isolated Neon
      test branch; review credentials/logs are preserved outside the worktree.
    refs:
      - "#42"
      - "I5D14"

  - date: "2026-10-12"
    version: "1.4.1.15"
    commit: 7ff4cc2
    status: committed
    title: "fix(security): remediate dependency advisories and validate auth compatibility"
    details: |-
      Incorporates PR #41's Kysely hardening and remediates the full dependency
      backlog from 77 reported advisories to zero. Updates Better Auth, Sentry,
      TanStack, Undici, Seroval, and vulnerable build/transitive dependencies.
      Aligns Nitro with Vite 8 and its plugins, Store with router hydration,
      and Zod with Better Auth IP validation. Moves Sentry initialization to
      the client entry and enforces deterministic sitemap LF checkouts.

      Adds auth integration coverage for sessions, forwarded IPs, magic-link
      replay, and verification-purpose separation, plus English language
      metadata in browser smoke coverage. Full validation and release limits
      are recorded in specs/current-changes/security-pr-review-2026-10-10.md.
      Changes await PR checks and release; no merge or deployment is recorded.
      Follow-up validation: all 19 browser tests passed against an isolated
      Neon branch derived from preview, including all five signed-in tiers.
      Authenticated Vercel CLI SSR checks passed on four hosted public routes.
      Shared preview had no application tables; its seed guard was preserved.
    refs:
      - "#41"
      - "I5D14"

  - date: "2026-05-04"
    version: "1.4.1.14"
    commit: pending
    status: uncommitted
    title: "fix(tooling,billing): restore Ultracite presets and require HTTPS Storefront URLs"
    details: |-
      Addresses the local code-review findings before merging PR `#38`:

      - Restored the shared Ultracite Biome presets and the original filename
        convention rule.
      - Added narrow Biome suppressions only where required: RFC 4122 UUID v4
        bit masks and the existing destructive-progress reset confirmation.
      - Made Storefront URL normalization require HTTPS for public checkout
        CTAs while keeping the shared URL helper reusable for non-checkout HTTP
        use cases.
      - Added URL helper and Storefront config regression coverage for HTTPS
        checkout requirements.
      - Re-ran formatting under the restored Ultracite presets, so previously
        drifted files are back under the shared formatting profile.

      Validation: targeted billing/url/practice tests, `pnpm format`,
      `pnpm lint`, and `pnpm run typecheck` passed before staging.
    refs:
      - "I5D14"
      - "#36"
      - "#38"

  - date: "2026-05-04"
    version: "1.4.1.13"
    commit: 8fb0f49
    status: committed
    title: "fix(settings,billing): address fresh PR #38 Gemini review"
    details: |-
      Addresses the three unresolved Gemini review threads from the May 4
      fresh review pass on PR `#38`:

      - Moved Storefront HTTP/HTTPS URL normalization into a shared
        `normalizeHttpUrl` helper and routed billing Storefront config through
        it.
      - Made the fallback UUID v4 bit masks explicit and added deterministic
        regression coverage for the RFC 4122 version and variant bits.
      - Guarded async magic-link and sign-out completion handling in settings
        with an active component ref before navigation or state updates.

      Validation: targeted Storefront, URL helper, and practice-run tests plus
      typecheck passed before the full commit-process validation pass.
    refs:
      - "I5D14"
      - "#36"
      - "#38"

  - date: "2026-05-04"
    version: "1.4.1.12"
    commit: 0b73dbc
    status: committed
    title: "chore(memory-bank): cap changelog archive files below 1000 lines"
    details: |-
      Fixes the memory-bank hygiene issue found during PR `#38` review work:

      - Split the oversized historical changelog archive into two closed
        archives, each below the 1,000-line initialization limit.
      - Added a changelog archive README identifying the latest closed archive
        and explaining how future quarter-numbered archive files should be
        interpreted.
      - Updated `scripts/rotate-changelog.sh` to enforce
        `MAX_ARCHIVE_LINES` (default 1,000) and create the next archive file
        before an append would exceed the cap.
      - Fixed date parsing for extracted entries that start with `- date:` so
        future rotated archives use quarter-based names instead of the
        `UNKNOWN` fallback.
      - Updated memory-bank usage guidance so archive files are historical
        reference and not part of default thread initialization.

      Validation: Bash syntax check, temp-file rotation test, and active plus
      archive file line-count checks all passed.
    refs:
      - "#38"

  - date: "2026-05-04"
    version: "1.4.1.11"
    commit: eaee7b3
    status: committed
    title: "fix(header,plans): address latest PR #38 review feedback"
    details: |-
      Addresses the two unresolved Gemini review threads on PR `#38`:

      - `src/components/layout/Header.tsx`: extracted the duplicated
        session-aware account label logic into `useAccountLabel()` so desktop
        and mobile account navigation derive "Sign in" versus "Account" from
        the same Better Auth session source.
      - `tests/browser/smoke.spec.ts`: updated the `/plans` smoke coverage to
        assert the internal Creem Product IDs are absent from the public page,
        matching the intentional Product ID removal from the public UI.
      - `specs/current-changes/issue-5-final-production-readiness-plan.md`:
        corrected the implementation progress note so the plan records that
        raw Creem Product IDs are kept internal and Storefront URLs are the
        public purchase surface.

      Validation: focused Playwright plans smoke check and TypeScript
      typecheck passed before the full commit-process validation pass.
    refs:
      - "I5D14"
      - "#36"
      - "#38"

  - date: "2026-04-30"
    version: "1.4.1.10"
    commit: fbefb44
    status: committed
    title: "fix(plans,settings): address final PR #38 review feedback"
    details: |-
      Addresses the unresolved PR `#38` code-review comments from the latest
      Gemini review pass and moves the remaining manual activation checks into
      a dedicated GitHub follow-up issue.

      - `src/routes/settings.tsx`: added `useNavigate` import from
        `@tanstack/react-router`, added `const navigate = useNavigate()` to
        `AccountAccessCard` component, and replaced
        `window.location.reload()` with `navigate({ replace: true, to: "/" })` in the
        `handleSignOut` function.
      - Improved magic-link submission handling by clearing the settings URL
        state after a successful request, clearing the email field, and
        returning more specific user-facing messages for rate-limit,
        invalid-email, and network/fetch failures.
      - `src/routes/plans.tsx` and `src/lib/billing/storefront.ts`: stopped
        returning or rendering raw Creem Product IDs from the public `/plans`
        loader payload while preserving Storefront URL fallback behaviour.
      - `.env.example`: documented the Pro Product ID and Storefront URL
        variables with purpose and expected formats.
      - Created GitHub issue `#40` ("Manual Activation Checks") and moved the
        remaining deployed/provider-dashboard checks out of PR `#38`.

      No route changes and no schema changes. The sign-out flow now uses
      idiomatic React navigation instead of a full page reload, and the public
      plans page no longer exposes internal Product IDs.

      Validation: `pnpm format`, `pnpm lint`, `pnpm typecheck`,
      `pnpm test --run` (153/153 across 28 files).
    refs:
      - "#36"
      - "#38"
      - "#40"

